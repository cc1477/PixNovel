name: Build IPA & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PixNovel.xcodeproj -target PixNovel \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Release-iphoneos/PixNovel.app || { grep -E "error:" build.log | head -50; exit 1; }

      - name: Package IPA
        id: meta
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PixNovel.app Payload/
          zip -qry PixNovel.ipa Payload
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/PixNovel.app/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -lh PixNovel.ipa

      - name: Prepare site
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p site
          cp -R docs/* site/
          cp PixNovel.ipa site/PixNovel.ipa
          python3 scripts/make_site_meta.py site PixNovel.ipa

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixNovel-${{ steps.meta.outputs.version }}-${{ github.run_number }}
          path: PixNovel.ipa

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-build${{ github.run_number }}
          name: PixNovel ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            未签名 IPA，可用全能签 / LCSign / TrollStore 等工具签名安装。
            分发页：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: PixNovel.ipa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
